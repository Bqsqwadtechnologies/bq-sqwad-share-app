name: Branding
on:
  workflow_dispatch:
  push:
    paths:
      - branding/logo/logo.png
      - scripts/generate_branding.py
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow && python3 scripts/generate_branding.py
