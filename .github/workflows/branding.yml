name: Branding
on:
  workflow_dispatch:
  push:
    paths:
      - branding/logo/logo.png
      - scripts/generate_branding.py
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow && python3 scripts/generate_branding.py
      - name: Commit generated icons
        run: |
          git config user.name "bq-sqwad-bot"
          git config user.email "bqsqwadtechnologies@bqsqwadai.com"
          git add -A app/src/main/res branding/logo
          git diff --cached --quiet || (git commit -m "Regenerate icons from logo" && git push)
